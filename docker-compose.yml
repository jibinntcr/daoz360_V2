version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: daoz360-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: daoz360-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: daoz360-worker
    env_file:
      - .env.example
    environment:
      MONGODB_URI: mongodb://mongodb:27017/daoz360?replicaSet=rs0
      S3_ENDPOINT: http://minio:9000

volumes:
  mongodb_data:
  minio_data:
